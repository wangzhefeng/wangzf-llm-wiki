<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="80" y="90" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Prediction Interval Matters</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <line x1="120" y1="600" x2="1160" y2="600" stroke="#94a3b8" stroke-width="4"/>
    <line x1="120" y1="170" x2="120" y2="600" stroke="#94a3b8" stroke-width="4"/>

    <path d="M180 500 C260 420, 340 420, 420 470 S580 560, 660 460 S820 250, 900 350 S1020 500, 1100 440
             L1100 560 C1020 590, 940 570, 860 520 S700 560, 620 560 S460 540, 380 520 S260 560, 180 560 Z"
      fill="#bfdbfe" opacity="0.9"/>

    <path d="M180 530 C260 470, 340 470, 420 500 S580 520, 660 490 S820 340, 900 400 S1020 510, 1100 470"
      fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>

    <path d="M180 545 C260 495, 340 505, 420 520 S580 530, 660 515 S820 395, 900 430 S1020 525, 1100 495"
      fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 10"/>

    <text x="930" y="240" font-size="24" fill="#1e3a8a">wider interval in volatile period</text>
    <text x="830" y="640" font-size="20" fill="#475569">time</text>
    <text x="65" y="170" font-size="20" fill="#475569" transform="rotate(-90 65,170)">load</text>

    <rect x="160" y="120" width="26" height="26" rx="6" fill="#bfdbfe"/>
    <text x="200" y="140" font-size="20" fill="#334155">5% - 95% interval</text>
    <line x1="430" y1="133" x2="470" y2="133" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <text x="490" y="140" font-size="20" fill="#334155">median forecast</text>
    <line x1="720" y1="133" x2="760" y2="133" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 10"/>
    <text x="780" y="140" font-size="20" fill="#334155">observed series</text>
  </g>
</svg>
