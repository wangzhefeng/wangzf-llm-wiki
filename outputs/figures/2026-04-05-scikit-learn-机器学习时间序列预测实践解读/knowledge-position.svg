    <text x="640" y="430" text-anchor="middle" font-size="27" font-weight="700" fill="#92400e">Model evaluation</text>
    <text x="640" y="465" text-anchor="middle" font-size="21" fill="#92400e">TimeSeriesSplit / gap</text>

    <rect x="910" y="380" width="260" height="120" rx="24" ry="24" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="1040" y="430" text-anchor="middle" font-size="27" font-weight="700" fill="#7f1d1d">Open extension</text>
